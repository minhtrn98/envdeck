ShortDescription: Profile-based manager for Windows environment variables, with a native window and a CLI.
Description: |-
  EnvDeck keeps per-project environment variables (JAVA_HOME, PATH entries, SDK paths...) in JSON profiles
  that you turn on and off. Turning a profile off restores exactly what it changed. Profiles are versioned,
  every change is backed up first, and a single bundle moves everything to a new machine.
